name: Site checks

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Vercel config
        run: python3 -m json.tool vercel.json >/dev/null

      - name: Check static HTML links and blocked tags
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path(".")
          forbidden = {"script", "iframe", "object", "embed", "form", "input"}

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.ids = []
                  self.tags = []

              def handle_starttag(self, tag, attrs):
                  self.tags.append(tag)
                  data = dict(attrs)
                  if "id" in data:
                      self.ids.append(data["id"])
                  for attr in ("href", "src"):
                      if attr in data:
                          self.refs.append((tag, attr, data[attr]))

          errors = []
          for html in sorted(root.glob("*.html")):
              parser = PageParser()
              parser.feed(html.read_text(encoding="utf-8"))
              ids = set(parser.ids)
              if "main-content" not in ids:
                  errors.append(f"{html}: missing #main-content")
              for tag in forbidden.intersection(parser.tags):
                  errors.append(f"{html}: forbidden tag <{tag}>")
              for tag, attr, value in parser.refs:
                  if not value or value.startswith(("mailto:", "tel:", "http://", "https://", "data:")):
                      continue
                  base = value.split("#", 1)[0].split("?", 1)[0]
                  fragment = value.split("#", 1)[1] if "#" in value else ""
                  target = html if base in ("", "./") else root / base
                  if base and not target.exists():
                      errors.append(f"{html}: {tag} {attr}={value} missing {target}")
                  if fragment and base in ("", "./", html.name, "./" + html.name) and fragment not in ids:
                      errors.append(f"{html}: missing #{fragment}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print("static checks ok")
          PY
