<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="metalGold" x1="600" y1="40" x2="1100" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6f737b" stop-opacity=".16"/>
      <stop offset=".34" stop-color="#f3d7ad" stop-opacity=".58"/>
      <stop offset=".58" stop-color="#b8874c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff3df" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="metalSteel" x1="1080" y1="20" x2="620" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset=".4" stop-color="#d9dde3" stop-opacity=".46"/>
      <stop offset=".68" stop-color="#2e3238" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f0d2a4" stop-opacity=".16"/>
    </linearGradient>
    <filter id="softMetalGlow" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .helix,
    .strand,
    .inner,
    .rung {
      transform-box: fill-box;
      transform-origin: center;
    }

    .strand,
    .inner,
    .rung {
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .strand {
      fill: none;
      filter: url(#softMetalGlow);
    }

    .gold {
      stroke: url(#metalGold);
      animation: gold-roll 7.2s linear infinite;
    }

    .steel {
      stroke: url(#metalSteel);
      animation: steel-roll 7.2s linear infinite;
    }

    .inner.gold,
    .inner.steel {
      animation-duration: 5.4s;
    }

    .rung {
      stroke: rgba(236, 208, 168, .22);
      stroke-width: 1.1;
      animation: rung-roll 7.2s linear infinite;
    }

    .outer {
      opacity: .58;
      animation: quiet-drift 24s ease-in-out infinite;
    }

    .inner-field {
      opacity: .38;
      animation: quiet-drift-inner 18s ease-in-out infinite;
    }

    @keyframes gold-roll {
      0%, 100% { stroke-width: 5.2; stroke-opacity: .28; }
      24% { stroke-width: 9.2; stroke-opacity: .7; }
      50% { stroke-width: 4.1; stroke-opacity: .2; }
      76% { stroke-width: 7.2; stroke-opacity: .48; }
    }

    @keyframes steel-roll {
      0%, 100% { stroke-width: 8.4; stroke-opacity: .56; }
      24% { stroke-width: 3.8; stroke-opacity: .18; }
      50% { stroke-width: 7.4; stroke-opacity: .48; }
      76% { stroke-width: 3.6; stroke-opacity: .16; }
    }

    @keyframes rung-roll {
      0%, 100% { opacity: .12; stroke-width: .8; }
      24% { opacity: .34; stroke-width: 1.25; }
      50% { opacity: .16; stroke-width: .85; }
      76% { opacity: .28; stroke-width: 1.1; }
    }

    @keyframes quiet-drift {
      0%, 100% { transform: translate(0, 0) rotate(-1deg); }
      50% { transform: translate(12px, -4px) rotate(1deg); }
    }

    @keyframes quiet-drift-inner {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-8px, 5px) scale(1.015); }
    }

    @media (prefers-reduced-motion: reduce) {
      .gold,
      .steel,
      .rung,
      .outer,
      .inner-field {
        animation: none;
      }
    }
  </style>

  <g class="helix outer" transform="translate(80 -18) rotate(-6 860 460)">
    <path class="strand steel" d="M810 -40 C1030 105 1030 235 810 380 C590 525 590 660 810 805 C945 895 970 975 860 1050"/>
    <path class="strand gold" d="M940 -40 C720 105 720 235 940 380 C1160 525 1160 660 940 805 C805 895 780 975 890 1050"/>
    <g>
      <line class="rung" x1="875" y1="38" x2="875" y2="302"/>
      <line class="rung" x1="810" y1="116" x2="940" y2="224"/>
      <line class="rung" x1="760" y1="194" x2="990" y2="146"/>
      <line class="rung" x1="790" y1="382" x2="960" y2="382"/>
      <line class="rung" x1="760" y1="570" x2="990" y2="618"/>
      <line class="rung" x1="810" y1="648" x2="940" y2="756"/>
      <line class="rung" x1="875" y1="728" x2="875" y2="892"/>
    </g>
  </g>

  <g class="helix inner-field" transform="translate(136 126) rotate(-6 860 460)">
    <path class="strand inner steel" d="M812 250 C925 325 925 395 812 470 C700 545 700 615 812 690"/>
    <path class="strand inner gold" d="M900 250 C788 325 788 395 900 470 C1012 545 1012 615 900 690"/>
    <g>
      <line class="rung" x1="856" y1="292" x2="856" y2="430"/>
      <line class="rung" x1="812" y1="336" x2="900" y2="384"/>
      <line class="rung" x1="812" y1="470" x2="900" y2="470"/>
      <line class="rung" x1="812" y1="604" x2="900" y2="556"/>
      <line class="rung" x1="856" y1="512" x2="856" y2="648"/>
    </g>
  </g>
</svg>
