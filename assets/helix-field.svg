<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="goldSkin" x1="0" y1="-24" x2="560" y2="24" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop stop-color="#15171c" stop-opacity=".32"/>
      <stop offset=".14" stop-color="#6c7078" stop-opacity=".5"/>
      <stop offset=".28" stop-color="#fff2dc" stop-opacity=".92"/>
      <stop offset=".44" stop-color="#b9854b" stop-opacity=".76"/>
      <stop offset=".58" stop-color="#fff9ef" stop-opacity=".9"/>
