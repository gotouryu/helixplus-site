      <stop offset="1" stop-color="#f7f8fa" stop-opacity=".24"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-180 0;180 0;-180 0" dur="6.4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="steelSkin" x1="0" y1="24" x2="560" y2="-24" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop stop-color="#fbfcff" stop-opacity=".28"/>
      <stop offset=".17" stop-color="#191c22" stop-opacity=".72"/>
      <stop offset=".36" stop-color="#f8fbff" stop-opacity=".88"/>
      <stop offset=".54" stop-color="#4a5059" stop-opacity=".68"/>
      <stop offset=".73" stop-color="#f1d0a0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#111319" stop-opacity=".34"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="160 0;-160 0;160 0" dur="6.4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="crestLight" x1="0" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".24" stop-color="#ffffff" stop-opacity=".82"/>
      <stop offset=".43" stop-color="#fff1d2" stop-opacity=".48"/>
      <stop offset=".68" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-130 0;130 0;-130 0" dur="6.4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="metalDepth" x="-8%" y="-180%" width="116%" height="460%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.2" flood-color="#000000" flood-opacity=".44"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#f0d1a0" flood-opacity=".18"/>
    </filter>
