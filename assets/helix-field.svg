<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="goldSkin" x1="0" y1="-24" x2="560" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15171c" stop-opacity=".32"/>
      <stop offset=".14" stop-color="#6c7078" stop-opacity=".5"/>
      <stop offset=".28" stop-color="#fff2dc" stop-opacity=".92"/>
      <stop offset=".44" stop-color="#b9854b" stop-opacity=".76"/>
      <stop offset=".58" stop-color="#fff9ef" stop-opacity=".9"/>
      <stop offset=".76" stop-color="#755337" stop-opacity=".56"/>
      <stop offset="1" stop-color="#f7f8fa" stop-opacity=".24"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-180 0;180 0;-180 0" dur="6.4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="steelSkin" x1="0" y1="24" x2="560" y2="-24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfcff" stop-opacity=".28"/>
      <stop offset=".17" stop-color="#191c22" stop-opacity=".72"/>
      <stop offset=".36" stop-color="#f8fbff" stop-opacity=".88"/>
      <stop offset=".54" stop-color="#4a5059" stop-opacity=".68"/>
      <stop offset=".73" stop-color="#f1d0a0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#111319" stop-opacity=".34"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="160 0;-160 0;160 0" dur="6.4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="crestLight" x1="0" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".24" stop-color="#ffffff" stop-opacity=".82"/>
      <stop offset=".43" stop-color="#fff1d2" stop-opacity=".48"/>
      <stop offset=".68" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-130 0;130 0;-130 0" dur="6.4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="metalDepth" x="-8%" y="-180%" width="116%" height="460%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.2" flood-color="#000000" flood-opacity=".44"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#f0d1a0" flood-opacity=".18"/>
    </filter>
    <symbol id="continuousMetalHelix" viewBox="0 -54 560 108" overflow="visible">
      <path class="strand shadow-a" d="M0 0 C46 -33 94 -33 140 0 C186 33 234 33 280 0 C326 -33 374 -33 420 0 C466 33 514 33 560 0"/>
      <path class="strand shadow-b" d="M0 0 C46 33 94 33 140 0 C186 -33 234 -33 280 0 C326 33 374 33 420 0 C466 -33 514 -33 560 0"/>
      <path class="strand steel" d="M0 0 C46 -33 94 -33 140 0 C186 33 234 33 280 0 C326 -33 374 -33 420 0 C466 33 514 33 560 0"/>
      <path class="strand gold" d="M0 0 C46 33 94 33 140 0 C186 -33 234 -33 280 0 C326 33 374 33 420 0 C466 -33 514 -33 560 0"/>
      <path class="crest crest-a" d="M0 0 C46 -33 94 -33 140 0 C186 33 234 33 280 0 C326 -33 374 -33 420 0 C466 33 514 33 560 0"/>
      <path class="crest crest-b" d="M0 0 C46 33 94 33 140 0 C186 -33 234 -33 280 0 C326 33 374 33 420 0 C466 -33 514 -33 560 0"/>
      <g class="rungs">
        <line x1="70" y1="-26" x2="70" y2="26"/>
        <line x1="210" y1="26" x2="210" y2="-26"/>
        <line x1="350" y1="-26" x2="350" y2="26"/>
        <line x1="490" y1="26" x2="490" y2="-26"/>
      </g>
    </symbol>
  </defs>

  <style>
    .stream,
    .flow,
    .strand,
    .crest,
    .rungs {
      transform-box: fill-box;
      transform-origin: center;
    }

    .strand,
    .crest,
    .rungs line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .strand {
      filter: url(#metalDepth);
    }

    .shadow-a,
    .shadow-b {
      stroke: rgba(0, 0, 0, .44);
      stroke-width: 9.4;
    }

    .shadow-a {
      animation: shadow-a-roll 6.4s linear infinite;
    }

    .shadow-b {
      animation: shadow-b-roll 6.4s linear infinite;
    }

    .steel {
      stroke: url(#steelSkin);
      animation: steel-roll 6.4s linear infinite;
    }

    .gold {
      stroke: url(#goldSkin);
      animation: gold-roll 6.4s linear infinite;
    }

    .crest {
      stroke: url(#crestLight);
      stroke-width: 1.65;
    }

    .crest-a {
      animation: crest-a-roll 6.4s linear infinite;
    }

    .crest-b {
      animation: crest-b-roll 6.4s linear infinite;
    }

    .rungs {
      stroke: rgba(236, 208, 168, .28);
      stroke-width: 1.15;
      animation: rung-roll 6.4s linear infinite;
    }

    .flow-right {
      animation: flow-right 34s linear infinite;
    }

    .flow-right.slow {
      animation-duration: 48s;
    }

    .flow-right.fast {
      animation-duration: 29s;
    }

    .stream-a {
      opacity: .66;
      animation: stream-a 19s ease-in-out infinite;
    }

    .stream-b {
      opacity: .5;
      animation: stream-b 24s ease-in-out infinite;
    }

    .stream-c {
      opacity: .38;
      animation: stream-c 28s ease-in-out infinite;
    }

    .stream-d {
      opacity: .3;
      animation: stream-d 33s ease-in-out infinite;
    }

    @keyframes flow-right {
      from { transform: translateX(-520px); }
      to { transform: translateX(0); }
    }

    @keyframes stream-a {
      0%, 100% { transform: translate(0, 0) rotate(-7deg); }
      43% { transform: translate(18px, -13px) rotate(-3deg); }
      72% { transform: translate(-12px, 10px) rotate(-10deg); }
    }

    @keyframes stream-b {
      0%, 100% { transform: translate(0, 0) rotate(8deg); }
      50% { transform: translate(-32px, 17px) rotate(13deg); }
    }

    @keyframes stream-c {
      0%, 100% { transform: translate(0, 0) rotate(-15deg); }
      50% { transform: translate(26px, 17px) rotate(-21deg); }
    }

    @keyframes stream-d {
      0%, 100% { transform: translate(0, 0) rotate(4deg); }
      50% { transform: translate(-21px, -11px) rotate(9deg); }
    }

    @keyframes steel-roll {
      0%, 100% { stroke-width: 9.4; stroke-opacity: .8; transform: translateY(0) scaleY(1); }
      25% { stroke-width: 4.2; stroke-opacity: .28; transform: translateY(1px) scaleY(.86); }
      50% { stroke-width: 8.6; stroke-opacity: .68; transform: translateY(0) scaleY(.97); }
      75% { stroke-width: 3.7; stroke-opacity: .2; transform: translateY(-1px) scaleY(.8); }
    }

    @keyframes gold-roll {
      0%, 100% { stroke-width: 4.1; stroke-opacity: .3; transform: translateY(1px) scaleY(.84); }
      25% { stroke-width: 9.8; stroke-opacity: .88; transform: translateY(0) scaleY(1); }
      50% { stroke-width: 3.6; stroke-opacity: .22; transform: translateY(-1px) scaleY(.78); }
      75% { stroke-width: 8; stroke-opacity: .66; transform: translateY(0) scaleY(.94); }
    }

    @keyframes shadow-a-roll {
      0%, 100% { stroke-width: 10.8; stroke-opacity: .36; transform: translateY(4px) scaleY(1.04); }
      25% { stroke-width: 5.4; stroke-opacity: .14; transform: translateY(1px) scaleY(.88); }
      50% { stroke-width: 9.4; stroke-opacity: .3; transform: translateY(3px) scaleY(.98); }
      75% { stroke-width: 4.8; stroke-opacity: .1; transform: translateY(0) scaleY(.82); }
    }

    @keyframes shadow-b-roll {
      0%, 100% { stroke-width: 5; stroke-opacity: .12; transform: translateY(0) scaleY(.86); }
      25% { stroke-width: 10.8; stroke-opacity: .36; transform: translateY(4px) scaleY(1.04); }
      50% { stroke-width: 4.6; stroke-opacity: .1; transform: translateY(0) scaleY(.8); }
      75% { stroke-width: 8.6; stroke-opacity: .28; transform: translateY(3px) scaleY(.96); }
    }

    @keyframes crest-a-roll {
      0%, 100% { stroke-width: 1.8; stroke-opacity: .28; }
      25% { stroke-width: 2.8; stroke-opacity: .86; }
      50% { stroke-width: 1.4; stroke-opacity: .2; }
      75% { stroke-width: 2.3; stroke-opacity: .64; }
    }

    @keyframes crest-b-roll {
      0%, 100% { stroke-width: 2.6; stroke-opacity: .78; }
      25% { stroke-width: 1.5; stroke-opacity: .22; }
      50% { stroke-width: 2.4; stroke-opacity: .64; }
      75% { stroke-width: 1.3; stroke-opacity: .18; }
    }

    @keyframes rung-roll {
      0%, 100% { opacity: .12; }
      25% { opacity: .34; }
      50% { opacity: .1; }
      75% { opacity: .25; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-right,
      .stream-a,
      .stream-b,
      .stream-c,
      .stream-d,
      .steel,
      .gold,
      .shadow-a,
      .shadow-b,
      .crest-a,
      .crest-b,
      .rungs {
        animation: none;
      }
    }
  </style>

  <g class="stream stream-a" transform="translate(-600 340) rotate(-7)">
    <g class="flow flow-right fast">
      <use href="#continuousMetalHelix" x="0"/><use href="#continuousMetalHelix" x="520"/><use href="#continuousMetalHelix" x="1040"/><use href="#continuousMetalHelix" x="1560"/><use href="#continuousMetalHelix" x="2080"/><use href="#continuousMetalHelix" x="2600"/>
    </g>
  </g>

  <g class="stream stream-b" transform="translate(-650 500) rotate(8) scale(1.16)">
    <g class="flow flow-right">
      <use href="#continuousMetalHelix" x="0"/><use href="#continuousMetalHelix" x="520"/><use href="#continuousMetalHelix" x="1040"/><use href="#continuousMetalHelix" x="1560"/><use href="#continuousMetalHelix" x="2080"/><use href="#continuousMetalHelix" x="2600"/>
    </g>
  </g>

  <g class="stream stream-c" transform="translate(-540 635) rotate(-15) scale(.86)">
    <g class="flow flow-right slow">
      <use href="#continuousMetalHelix" x="0"/><use href="#continuousMetalHelix" x="520"/><use href="#continuousMetalHelix" x="1040"/><use href="#continuousMetalHelix" x="1560"/><use href="#continuousMetalHelix" x="2080"/><use href="#continuousMetalHelix" x="2600"/>
    </g>
  </g>

  <g class="stream stream-d" transform="translate(-700 218) rotate(4) scale(.72)">
    <g class="flow flow-right slow">
      <use href="#continuousMetalHelix" x="0"/><use href="#continuousMetalHelix" x="520"/><use href="#continuousMetalHelix" x="1040"/><use href="#continuousMetalHelix" x="1560"/><use href="#continuousMetalHelix" x="2080"/><use href="#continuousMetalHelix" x="2600"/>
    </g>
  </g>
</svg>
