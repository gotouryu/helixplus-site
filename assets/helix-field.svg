<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="goldPlate" x1="0" y1="-42" x2="620" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14161b"/>
      <stop offset=".16" stop-color="#575a60"/>
      <stop offset=".31" stop-color="#fff0d7"/>
      <stop offset=".46" stop-color="#bd884b"/>
      <stop offset=".62" stop-color="#fff7e8"/>
      <stop offset=".82" stop-color="#745338"/>
      <stop offset="1" stop-color="#f6f7f8"/>
    </linearGradient>
    <linearGradient id="steelPlate" x1="0" y1="42" x2="620" y2="-42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f9fafb"/>
      <stop offset=".16" stop-color="#22262d"/>
      <stop offset=".36" stop-color="#f3f5f7"/>
      <stop offset=".56" stop-color="#595f68"/>
      <stop offset=".76" stop-color="#f1d0a0"/>
      <stop offset="1" stop-color="#171a20"/>
    </linearGradient>
    <linearGradient id="edgeLight" x1="0" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#ffffff" stop-opacity=".86"/>
      <stop offset=".48" stop-color="#fff1d2" stop-opacity=".5"/>
      <stop offset=".72" stop-color="#ffffff" stop-opacity=".74"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="hardShadow" x="-12%" y="-160%" width="124%" height="420%">
      <feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#000000" flood-opacity=".48"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#f1d0a0" flood-opacity=".18"/>
    </filter>
    <symbol id="metalRibbonHelix" viewBox="0 -76 620 152" overflow="visible">
      <path class="plate plate-shadow" d="M-6 10 C48 -40 92 -40 146 10 C197 57 244 57 294 10 C348 -40 392 -40 446 10 C497 57 544 57 626 2 L626 32 C552 86 493 86 434 31 C392 -8 348 -8 306 31 C247 86 190 86 134 31 C92 -8 48 -8 -6 40 Z"/>
      <path class="plate steel-plate" d="M0 0 C48 -42 92 -42 140 0 C190 44 238 44 286 0 C334 -42 378 -42 426 0 C476 44 524 44 620 0 L620 25 C522 78 468 78 414 25 C378 -10 334 -10 298 25 C244 78 184 78 128 25 C92 -10 48 -10 0 25 Z"/>
      <path class="plate gold-plate" d="M0 0 C48 42 92 42 140 0 C190 -44 238 -44 286 0 C334 42 378 42 426 0 C476 -44 524 -44 620 0 L620 -25 C522 -78 468 -78 414 -25 C378 10 334 10 298 -25 C244 -78 184 -78 128 -25 C92 10 48 10 0 -25 Z"/>
      <path class="edge edge-a" d="M6 -2 C52 -38 90 -38 136 -2 C190 38 238 38 286 -2 C334 -38 374 -38 420 -2 C474 38 522 38 614 -2"/>
      <path class="edge edge-b" d="M6 2 C52 38 90 38 136 2 C190 -38 238 -38 286 2 C334 38 374 38 420 2 C474 -38 522 -38 614 2"/>
      <g class="rungs">
        <path d="M72 -28 L72 28"/>
        <path d="M218 28 L218 -28"/>
        <path d="M364 -28 L364 28"/>
        <path d="M510 28 L510 -28"/>
      </g>
    </symbol>
  </defs>

  <style>
    .stream,
    .flow,
    .plate,
    .edge,
    .rungs {
      transform-box: fill-box;
      transform-origin: center;
    }

    .plate {
      filter: url(#hardShadow);
      fill-rule: evenodd;
    }

    .plate-shadow {
      fill: rgba(0, 0, 0, .42);
      animation: shadow-roll 6.6s linear infinite;
    }

    .steel-plate {
      fill: url(#steelPlate);
      animation: steel-roll 6.6s linear infinite;
    }

    .gold-plate {
      fill: url(#goldPlate);
      animation: gold-roll 6.6s linear infinite;
    }

    .edge {
      fill: none;
      stroke: url(#edgeLight);
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: edge-roll 6.6s linear infinite;
    }

    .rungs {
      fill: none;
      stroke: rgba(246, 221, 184, .42);
      stroke-width: 2.2;
      stroke-linecap: round;
      animation: rung-roll 6.6s linear infinite;
    }

    .flow-right {
      animation: flow-right 36s linear infinite;
    }

    .flow-right.slow {
      animation-duration: 50s;
    }

    .flow-right.fast {
      animation-duration: 30s;
    }

    .stream-a {
      opacity: .58;
      animation: stream-a 19s ease-in-out infinite;
    }

    .stream-b {
      opacity: .4;
      animation: stream-b 24s ease-in-out infinite;
    }

    .stream-c {
      opacity: .32;
      animation: stream-c 27s ease-in-out infinite;
    }

    .stream-d {
      opacity: .24;
      animation: stream-d 32s ease-in-out infinite;
    }

    @keyframes flow-right {
      from { transform: translateX(-620px); }
      to { transform: translateX(0); }
    }

    @keyframes stream-a {
      0%, 100% { transform: translate(0, 0) rotate(-7deg); }
      45% { transform: translate(18px, -12px) rotate(-3deg); }
      72% { transform: translate(-10px, 9px) rotate(-10deg); }
    }

    @keyframes stream-b {
      0%, 100% { transform: translate(0, 0) rotate(8deg); }
      50% { transform: translate(-32px, 16px) rotate(13deg); }
    }

    @keyframes stream-c {
      0%, 100% { transform: translate(0, 0) rotate(-15deg); }
      50% { transform: translate(26px, 16px) rotate(-21deg); }
    }

    @keyframes stream-d {
      0%, 100% { transform: translate(0, 0) rotate(4deg); }
      50% { transform: translate(-20px, -10px) rotate(9deg); }
    }

    @keyframes steel-roll {
      0%, 100% { opacity: .88; transform: scaleY(1); }
      24% { opacity: .22; transform: scaleY(.78); }
      50% { opacity: .78; transform: scaleY(.94); }
      76% { opacity: .2; transform: scaleY(.72); }
    }

    @keyframes gold-roll {
      0%, 100% { opacity: .22; transform: scaleY(.78); }
      24% { opacity: .92; transform: scaleY(1.02); }
      50% { opacity: .2; transform: scaleY(.72); }
      76% { opacity: .74; transform: scaleY(.94); }
    }

    @keyframes shadow-roll {
      0%, 100% { opacity: .44; transform: translateY(5px) scaleY(1.04); }
      50% { opacity: .26; transform: translateY(2px) scaleY(.9); }
    }

    @keyframes edge-roll {
      0%, 100% { stroke-width: 1.4; opacity: .28; }
      24% { stroke-width: 3.4; opacity: .86; }
      50% { stroke-width: 1.1; opacity: .2; }
      76% { stroke-width: 2.6; opacity: .64; }
    }

    @keyframes rung-roll {
      0%, 100% { opacity: .18; stroke-width: 1.6; }
      24% { opacity: .5; stroke-width: 2.6; }
      50% { opacity: .14; stroke-width: 1.4; }
      76% { opacity: .36; stroke-width: 2.1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-right,
      .stream-a,
      .stream-b,
      .stream-c,
      .stream-d,
      .steel-plate,
      .gold-plate,
      .plate-shadow,
      .edge,
      .rungs {
        animation: none;
      }
    }
  </style>

  <g class="stream stream-a" transform="translate(-640 336) rotate(-7)">
    <g class="flow flow-right fast">
      <use href="#metalRibbonHelix" x="0"/><use href="#metalRibbonHelix" x="620"/><use href="#metalRibbonHelix" x="1240"/><use href="#metalRibbonHelix" x="1860"/><use href="#metalRibbonHelix" x="2480"/>
    </g>
  </g>

  <g class="stream stream-b" transform="translate(-700 505) rotate(8) scale(1.14)">
    <g class="flow flow-right">
      <use href="#metalRibbonHelix" x="0"/><use href="#metalRibbonHelix" x="620"/><use href="#metalRibbonHelix" x="1240"/><use href="#metalRibbonHelix" x="1860"/><use href="#metalRibbonHelix" x="2480"/>
    </g>
  </g>

  <g class="stream stream-c" transform="translate(-560 642) rotate(-15) scale(.84)">
    <g class="flow flow-right slow">
      <use href="#metalRibbonHelix" x="0"/><use href="#metalRibbonHelix" x="620"/><use href="#metalRibbonHelix" x="1240"/><use href="#metalRibbonHelix" x="1860"/><use href="#metalRibbonHelix" x="2480"/>
    </g>
  </g>

  <g class="stream stream-d" transform="translate(-720 220) rotate(4) scale(.7)">
    <g class="flow flow-right slow">
      <use href="#metalRibbonHelix" x="0"/><use href="#metalRibbonHelix" x="620"/><use href="#metalRibbonHelix" x="1240"/><use href="#metalRibbonHelix" x="1860"/><use href="#metalRibbonHelix" x="2480"/>
    </g>
  </g>
</svg>
