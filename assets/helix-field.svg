      <path class="crest crest-b" d="M-1120 0 C-1074 33 -1026 33 -980 0 C-934 -33 -886 -33 -840 0 C-794 33 -746 33 -700 0 C-654 -33 -606 -33 -560 0 C-514 33 -466 33 -420 0 C-374 -33 -326 -33 -280 0 C-234 33 -186 33 -140 0 C-94 -33 -46 -33 0 0 C46 33 94 33 140 0 C186 -33 234 -33 280 0 C326 33 374 33 420 0 C466 -33 514 -33 560 0 C606 33 654 33 700 0 C746 -33 794 -33 840 0 C886 33 934 33 980 0 C1026 -33 1074 -33 1120 0 C1166 33 1214 33 1260 0 C1306 -33 1354 -33 1400 0 C1446 33 1494 33 1540 0 C1586 -33 1634 -33 1680 0 C1726 33 1774 33 1820 0 C1866 -33 1914 -33 1960 0 C2006 33 2054 33 2100 0 C2146 -33 2194 -33 2240 0 C2286 33 2334 33 2380 0 C2426 -33 2474 -33 2520 0 C2566 33 2614 33 2660 0 C2706 -33 2754 -33 2800 0 C2846 33 2894 33 2940 0 C2986 -33 3034 -33 3080 0 C3126 33 3174 33 3220 0 C3266 -33 3314 -33 3360 0"/>
    </g>
  </defs>

  <style>
    .stream,
    .flow,
    .strand,
    .crest {
      transform-box: fill-box;
      transform-origin: center;
    }

    .strand,
    .crest {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .strand {
      filter: url(#metalDepth);
    }

    .shadow-a,
    .shadow-b {
      stroke: rgba(0, 0, 0, .44);
      stroke-width: 9.4;
    }

    .shadow-a {
      animation: shadow-a-roll 6.4s linear infinite;
    }

    .shadow-b {
      animation: shadow-b-roll 6.4s linear infinite;
    }

    .steel {
      stroke: url(#steelSkin);
      animation: steel-roll 6.4s linear infinite;
    }

    .gold {
      stroke: url(#goldSkin);
      animation: gold-roll 6.4s linear infinite;
    }

    .crest {
      stroke: url(#crestLight);
      stroke-width: 1.65;
    }

    .crest-a {
      animation: crest-a-roll 6.4s linear infinite;
    }

    .crest-b {
      animation: crest-b-roll 6.4s linear infinite;
    }

    .flow-right {
      animation: flow-right 34s linear infinite;
    }

    .flow-right.slow {
      animation-duration: 48s;
    }

    .flow-right.fast {
      animation-duration: 29s;
    }

    .stream-a {
      opacity: .66;
      animation: stream-a 19s ease-in-out infinite;
    }

    .stream-b {
      opacity: .5;
      animation: stream-b 24s ease-in-out infinite;
    }

    .stream-c {
      opacity: .38;
      animation: stream-c 28s ease-in-out infinite;
    }

    .stream-d {
      opacity: .3;
      animation: stream-d 33s ease-in-out infinite;
    }

    .stream-e {
      opacity: .34;
      animation: stream-e 26s ease-in-out infinite;
    }

    .stream-f {
      opacity: .24;
      animation: stream-f 38s ease-in-out infinite;
    }

    @keyframes flow-right {
      from { transform: translateX(-560px); }
      to { transform: translateX(0); }
    }

    @keyframes stream-a {
      0%, 100% { transform: translate(-600px, 340px) rotate(-7deg) scale(1, .88); }
      43% { transform: translate(-582px, 327px) rotate(-3deg) scale(1.04, 1.08); }
      72% { transform: translate(-612px, 350px) rotate(-10deg) scale(.98, .58); }
    }

    @keyframes stream-b {
      0%, 100% { transform: translate(-650px, 500px) rotate(8deg) scale(1.16, .72); }
      50% { transform: translate(-682px, 517px) rotate(13deg) scale(1.2, 1.14); }
    }

    @keyframes stream-c {
      0%, 100% { transform: translate(-540px, 635px) rotate(-15deg) scale(.86, .52); }
      50% { transform: translate(-514px, 652px) rotate(-21deg) scale(.92, .88); }
    }

    @keyframes stream-d {
      0%, 100% { transform: translate(-700px, 218px) rotate(4deg) scale(.72, .42); }
      50% { transform: translate(-721px, 207px) rotate(9deg) scale(.78, .76); }
    }

    @keyframes stream-e {
      0%, 100% { transform: translate(-640px, 410px) rotate(-2deg) scale(1.04, .72); }
      33% { transform: translate(-610px, 392px) rotate(5deg) scale(1.08, 1.02); }
      66% { transform: translate(-672px, 428px) rotate(-9deg) scale(1, .58); }
    }

    @keyframes stream-f {
      0%, 100% { transform: translate(-760px, 580px) rotate(12deg) scale(.94, .54); }
      40% { transform: translate(-728px, 604px) rotate(4deg) scale(1.02, .92); }
      72% { transform: translate(-790px, 562px) rotate(18deg) scale(.9, .46); }
    }

    @keyframes steel-roll {
      0%, 100% { stroke-width: 9.4; stroke-opacity: .8; transform: translateY(0) scaleY(1); }
      25% { stroke-width: 4.2; stroke-opacity: .28; transform: translateY(1px) scaleY(.86); }
      50% { stroke-width: 8.6; stroke-opacity: .68; transform: translateY(0) scaleY(.97); }
      75% { stroke-width: 3.7; stroke-opacity: .2; transform: translateY(-1px) scaleY(.8); }
    }

    @keyframes gold-roll {
      0%, 100% { stroke-width: 4.1; stroke-opacity: .3; transform: translateY(1px) scaleY(.84); }
      25% { stroke-width: 9.8; stroke-opacity: .88; transform: translateY(0) scaleY(1); }
      50% { stroke-width: 3.6; stroke-opacity: .22; transform: translateY(-1px) scaleY(.78); }
      75% { stroke-width: 8; stroke-opacity: .66; transform: translateY(0) scaleY(.94); }
    }

    @keyframes shadow-a-roll {
      0%, 100% { stroke-width: 10.8; stroke-opacity: .36; transform: translateY(4px) scaleY(1.04); }
      25% { stroke-width: 5.4; stroke-opacity: .14; transform: translateY(1px) scaleY(.88); }
      50% { stroke-width: 9.4; stroke-opacity: .3; transform: translateY(3px) scaleY(.98); }
      75% { stroke-width: 4.8; stroke-opacity: .1; transform: translateY(0) scaleY(.82); }
    }

    @keyframes shadow-b-roll {
      0%, 100% { stroke-width: 5; stroke-opacity: .12; transform: translateY(0) scaleY(.86); }
      25% { stroke-width: 10.8; stroke-opacity: .36; transform: translateY(4px) scaleY(1.04); }
      50% { stroke-width: 4.6; stroke-opacity: .1; transform: translateY(0) scaleY(.8); }
      75% { stroke-width: 8.6; stroke-opacity: .28; transform: translateY(3px) scaleY(.96); }
    }

    @keyframes crest-a-roll {
      0%, 100% { stroke-width: 1.8; stroke-opacity: .28; }
      25% { stroke-width: 2.8; stroke-opacity: .86; }
      50% { stroke-width: 1.4; stroke-opacity: .2; }
      75% { stroke-width: 2.3; stroke-opacity: .64; }
    }

    @keyframes crest-b-roll {
      0%, 100% { stroke-width: 2.6; stroke-opacity: .78; }
      25% { stroke-width: 1.5; stroke-opacity: .22; }
      50% { stroke-width: 2.4; stroke-opacity: .64; }
      75% { stroke-width: 1.3; stroke-opacity: .18; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-right,
      .stream-a,
      .stream-b,
      .stream-c,
      .stream-d,
      .stream-e,
      .stream-f,
      .steel,
      .gold,
      .shadow-a,
      .shadow-b,
      .crest-a,
      .crest-b {
        animation: none;
      }
    }
  </style>

  <g class="stream stream-a" transform="translate(-600 340) rotate(-7)">
    <g class="flow flow-right fast">
      <use href="#continuousMetalHelix"/>
    </g>
  </g>

  <g class="stream stream-b" transform="translate(-650 500) rotate(8) scale(1.16)">
    <g class="flow flow-right">
      <use href="#continuousMetalHelix"/>
    </g>
  </g>

  <g class="stream stream-c" transform="translate(-540 635) rotate(-15) scale(.86)">
    <g class="flow flow-right slow">
      <use href="#continuousMetalHelix"/>
    </g>
  </g>

  <g class="stream stream-d" transform="translate(-700 218) rotate(4) scale(.72)">
    <g class="flow flow-right slow">
      <use href="#continuousMetalHelix"/>
    </g>
  </g>

  <g class="stream stream-e" transform="translate(-640 410) rotate(-2) scale(1.04 .72)">
    <g class="flow flow-right">
      <use href="#continuousMetalHelix"/>
    </g>
  </g>

  <g class="stream stream-f" transform="translate(-760 580) rotate(12) scale(.94 .54)">
    <g class="flow flow-right slow">
      <use href="#continuousMetalHelix"/>
    </g>
  </g>
</svg>
