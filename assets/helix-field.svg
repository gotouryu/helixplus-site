<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="goldStrand" x1="0" y1="-18" x2="96" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8D929C" stop-opacity=".12"/>
      <stop offset=".36" stop-color="#F0D7B2" stop-opacity=".72"/>
      <stop offset=".58" stop-color="#B9894F" stop-opacity=".54"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="steelStrand" x1="0" y1="18" x2="96" y2="-18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset=".48" stop-color="#FFFFFF" stop-opacity=".56"/>
      <stop offset="1" stop-color="#ECD0A8" stop-opacity=".18"/>
    </linearGradient>
    <filter id="strandGlow" x="-16%" y="-180%" width="132%" height="460%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <symbol id="lineIsHelix" viewBox="0 -22 96 44" overflow="visible">
      <path class="strand back" stroke="url(#goldStrand)" d="M0 0 C8 -12 16 -12 24 0 C32 12 40 12 48 0 C56 -12 64 -12 72 0 C80 12 88 12 96 0"/>
      <path class="strand front" stroke="url(#steelStrand)" d="M0 0 C8 12 16 12 24 0 C32 -12 40 -12 48 0 C56 12 64 12 72 0 C80 -12 88 -12 96 0"/>
      <g class="rungs" stroke="#ECD0A8">
        <line x1="12" y1="-10" x2="12" y2="10"/>
        <line x1="36" y1="10" x2="36" y2="-10"/>
        <line x1="60" y1="-10" x2="60" y2="10"/>
        <line x1="84" y1="10" x2="84" y2="-10"/>
      </g>
    </symbol>
  </defs>

  <style>
    .rail,
    .flow,
    .float {
      transform-box: fill-box;
      transform-origin: center;
    }

    .strand,
    .rungs line {
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .strand {
      stroke-width: 1.65;
      filter: url(#strandGlow);
    }

    .front {
      animation: front-depth 4.8s linear infinite;
    }

    .back {
      animation: back-depth 4.8s linear infinite;
    }

    .rungs {
      stroke-width: .75;
      animation: rung-depth 4.8s linear infinite;
    }

    .flow-left {
      animation: flow-left 18s linear infinite;
    }

    .flow-right {
      animation: flow-right 18s linear infinite;
    }

    .slow {
      animation-duration: 26s;
    }

    .float-a {
      animation: float-a 15s linear infinite;
    }

    .float-b {
      animation: float-b 19s linear infinite;
    }

    .float-c {
      animation: float-c 23s linear infinite;
    }

    @keyframes flow-left {
      from { transform: translateX(0); }
      to { transform: translateX(-96px); }
    }

    @keyframes flow-right {
      from { transform: translateX(-96px); }
      to { transform: translateX(0); }
    }

    @keyframes front-depth {
      0%, 100% { stroke-opacity: .24; stroke-width: .95; }
      25% { stroke-opacity: .84; stroke-width: 2.35; }
      50% { stroke-opacity: .22; stroke-width: .9; }
      75% { stroke-opacity: .64; stroke-width: 1.9; }
    }

    @keyframes back-depth {
      0%, 100% { stroke-opacity: .72; stroke-width: 2.05; }
      25% { stroke-opacity: .18; stroke-width: .88; }
      50% { stroke-opacity: .62; stroke-width: 1.8; }
      75% { stroke-opacity: .16; stroke-width: .82; }
    }

    @keyframes rung-depth {
      0%, 100% { opacity: .22; }
      25% { opacity: .46; }
      50% { opacity: .18; }
      75% { opacity: .36; }
    }

    @keyframes float-a {
      0%, 100% { transform: translate(0, 0) skewX(0deg); }
      25% { transform: translate(9px, -7px) skewX(.5deg); }
      50% { transform: translate(18px, 5px) skewX(-.4deg); }
      75% { transform: translate(6px, 10px) skewX(.3deg); }
    }

    @keyframes float-b {
      0%, 100% { transform: translate(0, 0) skewX(0deg); }
      25% { transform: translate(-8px, 6px) skewX(-.4deg); }
      50% { transform: translate(-17px, -5px) skewX(.45deg); }
      75% { transform: translate(-5px, -10px) skewX(-.25deg); }
    }

    @keyframes float-c {
      0%, 100% { transform: translate(0, 0) skewX(0deg); }
      25% { transform: translate(7px, 8px) skewX(.35deg); }
      50% { transform: translate(-12px, 2px) skewX(-.5deg); }
      75% { transform: translate(5px, -9px) skewX(.4deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .front,
      .back,
      .rungs,
      .flow-left,
      .flow-right,
      .slow,
      .float-a,
      .float-b,
      .float-c {
        animation: none;
      }
    }
  </style>

  <g class="rail" opacity=".88" transform="translate(-260 265) rotate(-6)">
    <g class="float float-a">
      <g class="flow flow-left">
        <use href="#lineIsHelix" x="0"/><use href="#lineIsHelix" x="96"/><use href="#lineIsHelix" x="192"/><use href="#lineIsHelix" x="288"/><use href="#lineIsHelix" x="384"/><use href="#lineIsHelix" x="480"/><use href="#lineIsHelix" x="576"/><use href="#lineIsHelix" x="672"/><use href="#lineIsHelix" x="768"/><use href="#lineIsHelix" x="864"/><use href="#lineIsHelix" x="960"/><use href="#lineIsHelix" x="1056"/><use href="#lineIsHelix" x="1152"/><use href="#lineIsHelix" x="1248"/><use href="#lineIsHelix" x="1344"/><use href="#lineIsHelix" x="1440"/><use href="#lineIsHelix" x="1536"/><use href="#lineIsHelix" x="1632"/><use href="#lineIsHelix" x="1728"/><use href="#lineIsHelix" x="1824"/>
      </g>
    </g>
  </g>

  <g class="rail" opacity=".78" transform="translate(-310 410) rotate(8)">
    <g class="float float-b">
      <g class="flow flow-right">
        <use href="#lineIsHelix" x="0"/><use href="#lineIsHelix" x="96"/><use href="#lineIsHelix" x="192"/><use href="#lineIsHelix" x="288"/><use href="#lineIsHelix" x="384"/><use href="#lineIsHelix" x="480"/><use href="#lineIsHelix" x="576"/><use href="#lineIsHelix" x="672"/><use href="#lineIsHelix" x="768"/><use href="#lineIsHelix" x="864"/><use href="#lineIsHelix" x="960"/><use href="#lineIsHelix" x="1056"/><use href="#lineIsHelix" x="1152"/><use href="#lineIsHelix" x="1248"/><use href="#lineIsHelix" x="1344"/><use href="#lineIsHelix" x="1440"/><use href="#lineIsHelix" x="1536"/><use href="#lineIsHelix" x="1632"/><use href="#lineIsHelix" x="1728"/><use href="#lineIsHelix" x="1824"/>
      </g>
    </g>
  </g>

  <g class="rail" opacity=".66" transform="translate(-250 575) rotate(-11) scale(1.05)">
    <g class="float float-c">
      <g class="flow flow-left slow">
        <use href="#lineIsHelix" x="0"/><use href="#lineIsHelix" x="96"/><use href="#lineIsHelix" x="192"/><use href="#lineIsHelix" x="288"/><use href="#lineIsHelix" x="384"/><use href="#lineIsHelix" x="480"/><use href="#lineIsHelix" x="576"/><use href="#lineIsHelix" x="672"/><use href="#lineIsHelix" x="768"/><use href="#lineIsHelix" x="864"/><use href="#lineIsHelix" x="960"/><use href="#lineIsHelix" x="1056"/><use href="#lineIsHelix" x="1152"/><use href="#lineIsHelix" x="1248"/><use href="#lineIsHelix" x="1344"/><use href="#lineIsHelix" x="1440"/><use href="#lineIsHelix" x="1536"/><use href="#lineIsHelix" x="1632"/><use href="#lineIsHelix" x="1728"/><use href="#lineIsHelix" x="1824"/>
      </g>
    </g>
  </g>

  <g class="rail" opacity=".36" transform="translate(-280 150) rotate(3) scale(.9)">
    <g class="flow flow-right slow">
      <use href="#lineIsHelix" x="0"/><use href="#lineIsHelix" x="96"/><use href="#lineIsHelix" x="192"/><use href="#lineIsHelix" x="288"/><use href="#lineIsHelix" x="384"/><use href="#lineIsHelix" x="480"/><use href="#lineIsHelix" x="576"/><use href="#lineIsHelix" x="672"/><use href="#lineIsHelix" x="768"/><use href="#lineIsHelix" x="864"/><use href="#lineIsHelix" x="960"/><use href="#lineIsHelix" x="1056"/><use href="#lineIsHelix" x="1152"/><use href="#lineIsHelix" x="1248"/><use href="#lineIsHelix" x="1344"/><use href="#lineIsHelix" x="1440"/><use href="#lineIsHelix" x="1536"/><use href="#lineIsHelix" x="1632"/><use href="#lineIsHelix" x="1728"/><use href="#lineIsHelix" x="1824"/>
    </g>
  </g>

  <g class="rail" opacity=".32" transform="translate(-300 745) rotate(5) scale(.92)">
    <g class="flow flow-left slow">
      <use href="#lineIsHelix" x="0"/><use href="#lineIsHelix" x="96"/><use href="#lineIsHelix" x="192"/><use href="#lineIsHelix" x="288"/><use href="#lineIsHelix" x="384"/><use href="#lineIsHelix" x="480"/><use href="#lineIsHelix" x="576"/><use href="#lineIsHelix" x="672"/><use href="#lineIsHelix" x="768"/><use href="#lineIsHelix" x="864"/><use href="#lineIsHelix" x="960"/><use href="#lineIsHelix" x="1056"/><use href="#lineIsHelix" x="1152"/><use href="#lineIsHelix" x="1248"/><use href="#lineIsHelix" x="1344"/><use href="#lineIsHelix" x="1440"/><use href="#lineIsHelix" x="1536"/><use href="#lineIsHelix" x="1632"/><use href="#lineIsHelix" x="1728"/><use href="#lineIsHelix" x="1824"/>
    </g>
  </g>
</svg>
