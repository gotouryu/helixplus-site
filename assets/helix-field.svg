<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="helixGold" x1="80" y1="760" x2="1360" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C6F76" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#ECD0A8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#B88A52" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="helixWhite" x1="120" y1="140" x2="1320" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .helix-field {
      transform-box: fill-box;
      transform-origin: center;
      animation: helix-wave 15s ease-in-out infinite alternate;
    }

    .helix-rings {
      transform-box: fill-box;
      transform-origin: center;
      animation: helix-roll 24s linear infinite;
    }

    .strand {
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 18 34;
      animation: helix-phase 8s linear infinite;
    }

    .strand.back {
      stroke-dasharray: 42 26;
      animation-duration: 11s;
      animation-direction: reverse;
    }

    .rib {
      stroke-dasharray: 4 16;
      animation: helix-phase 10s linear infinite reverse;
    }

    @keyframes helix-wave {
      0% { transform: translate(-18px, 10px) skewX(-2deg); }
      50% { transform: translate(20px, -12px) skewX(2deg); }
      100% { transform: translate(-8px, 16px) skewX(-1deg); }
    }

    @keyframes helix-roll {
      from { transform: rotate(0deg) scale(1); }
      to { transform: rotate(360deg) scale(1); }
    }

    @keyframes helix-phase {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -420; }
    }

    @media (prefers-reduced-motion: reduce) {
      .helix-field,
      .helix-rings,
      .strand,
      .rib {
        animation: none;
      }
    }
  </style>

  <g class="helix-field">
    <path class="strand" d="M-120 642C65 474 202 382 350 404C510 428 550 610 720 610C890 610 930 428 1090 404C1238 382 1375 474 1560 642" stroke="url(#helixGold)" stroke-width="2.2" filter="url(#softGlow)"/>
    <path class="strand back" d="M-120 258C65 426 202 518 350 496C510 472 550 290 720 290C890 290 930 472 1090 496C1238 518 1375 426 1560 258" stroke="url(#helixWhite)" stroke-width="1.8"/>
    <path class="strand" d="M-160 780C92 548 250 332 444 360C625 386 596 720 786 724C990 728 1010 398 1196 360C1355 328 1475 470 1600 590" stroke="#B88A52" stroke-opacity=".2" stroke-width="1.2"/>
    <path class="strand back" d="M-160 120C92 352 250 568 444 540C625 514 596 180 786 176C990 172 1010 502 1196 540C1355 572 1475 430 1600 310" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="1.1"/>

    <g class="helix-rings" opacity=".72">
      <ellipse cx="260" cy="506" rx="88" ry="28" transform="rotate(-16 260 506)" stroke="#ECD0A8" stroke-opacity=".2" stroke-width="1"/>
      <ellipse cx="410" cy="452" rx="104" ry="34" transform="rotate(-11 410 452)" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="1"/>
      <ellipse cx="570" cy="430" rx="116" ry="38" transform="rotate(-4 570 430)" stroke="#ECD0A8" stroke-opacity=".18" stroke-width="1"/>
      <ellipse cx="720" cy="450" rx="128" ry="42" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="1.1"/>
      <ellipse cx="870" cy="470" rx="116" ry="38" transform="rotate(4 870 470)" stroke="#ECD0A8" stroke-opacity=".18" stroke-width="1"/>
      <ellipse cx="1030" cy="448" rx="104" ry="34" transform="rotate(11 1030 448)" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="1"/>
      <ellipse cx="1180" cy="394" rx="88" ry="28" transform="rotate(16 1180 394)" stroke="#ECD0A8" stroke-opacity=".2" stroke-width="1"/>
    </g>

    <g stroke="#ECD0A8" stroke-opacity=".14" stroke-width=".9" stroke-linecap="round">
      <path class="rib" d="M260 506L350 404"/>
      <path class="rib" d="M410 452L510 472"/>
      <path class="rib" d="M570 430L620 592"/>
      <path class="rib" d="M720 450L720 610"/>
      <path class="rib" d="M870 470L820 592"/>
      <path class="rib" d="M1030 448L930 472"/>
      <path class="rib" d="M1180 394L1090 496"/>
    </g>
  </g>
</svg>
