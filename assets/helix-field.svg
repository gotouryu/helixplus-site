<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="helixGold" x1="0" y1="-24" x2="240" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6F7178" stop-opacity=".08"/>
      <stop offset=".32" stop-color="#EED6B2" stop-opacity=".56"/>
      <stop offset=".54" stop-color="#B88A52" stop-opacity=".46"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="helixSteel" x1="0" y1="-24" x2="240" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ECD0A8" stop-opacity=".12"/>
    </linearGradient>
    <filter id="softGlow" x="-8%" y="-140%" width="116%" height="380%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="microHelix" viewBox="0 -30 240 60" overflow="visible">
      <path class="back strand" stroke="url(#helixGold)" d="M0 0 C20 -16 40 -16 60 0 C80 16 100 16 120 0 C140 -16 160 -16 180 0 C200 16 220 16 240 0"/>
      <path class="front strand" stroke="url(#helixSteel)" d="M0 0 C20 16 40 16 60 0 C80 -16 100 -16 120 0 C140 16 160 16 180 0 C200 -16 220 -16 240 0"/>
      <g class="rungs" stroke="#ECD0A8">
        <line x1="30" y1="-16" x2="30" y2="16"/>
        <line x1="90" y1="16" x2="90" y2="-16"/>
        <line x1="150" y1="-16" x2="150" y2="16"/>
        <line x1="210" y1="16" x2="210" y2="-16"/>
      </g>
    </symbol>
  </defs>

  <style>
    .helix-layer,
    .stream {
      transform-box: fill-box;
      transform-origin: center;
    }

    .strand,
    .rungs line {
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .strand {
      stroke-width: 1.48;
      filter: url(#softGlow);
    }

    .front {
      animation: front-rotate 6s linear infinite;
    }

    .back {
      animation: back-rotate 6s linear infinite;
    }

    .rungs {
      stroke-width: .78;
      stroke-opacity: .3;
      animation: rung-rotate 6s linear infinite;
    }

    .stream-left {
      animation: flow-left 24s linear infinite;
    }

    .stream-right {
      animation: flow-right 24s linear infinite;
    }

    .stream-left.slow {
      animation-duration: 36s;
    }

    .stream-right.slow {
      animation-duration: 36s;
    }

    .float-a {
      animation: float-a 18s linear infinite;
    }

    .float-b {
      animation: float-b 22s linear infinite;
    }

    .float-c {
      animation: float-c 26s linear infinite;
    }

    @keyframes flow-left {
      from { transform: translateX(0); }
      to { transform: translateX(-240px); }
    }

    @keyframes flow-right {
      from { transform: translateX(-240px); }
      to { transform: translateX(0); }
    }

    @keyframes front-rotate {
      0%, 100% { stroke-opacity: .22; stroke-width: 1.05; }
      25% { stroke-opacity: .72; stroke-width: 2.05; }
      50% { stroke-opacity: .2; stroke-width: .9; }
      75% { stroke-opacity: .58; stroke-width: 1.7; }
    }

    @keyframes back-rotate {
      0%, 100% { stroke-opacity: .62; stroke-width: 1.9; }
      25% { stroke-opacity: .18; stroke-width: .88; }
      50% { stroke-opacity: .58; stroke-width: 1.7; }
      75% { stroke-opacity: .16; stroke-width: .84; }
    }

    @keyframes rung-rotate {
      0%, 100% { opacity: .18; }
      25% { opacity: .34; }
      50% { opacity: .16; }
      75% { opacity: .28; }
    }

    @keyframes float-a {
      0%, 100% { transform: translate(0, 0) skewX(0deg); }
      25% { transform: translate(14px, -10px) skewX(.7deg); }
      50% { transform: translate(28px, 4px) skewX(-.5deg); }
      75% { transform: translate(10px, 12px) skewX(.4deg); }
    }

    @keyframes float-b {
      0%, 100% { transform: translate(0, 0) skewX(0deg); }
      25% { transform: translate(-10px, 8px) skewX(-.5deg); }
      50% { transform: translate(-24px, -6px) skewX(.6deg); }
      75% { transform: translate(-8px, -14px) skewX(-.3deg); }
    }

    @keyframes float-c {
      0%, 100% { transform: translate(0, 0) skewX(0deg); }
      25% { transform: translate(9px, 11px) skewX(.4deg); }
      50% { transform: translate(-18px, 2px) skewX(-.7deg); }
      75% { transform: translate(6px, -12px) skewX(.5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .front,
      .back,
      .rungs,
      .stream-left,
      .stream-right,
      .float-a,
      .float-b,
      .float-c {
        animation: none;
      }
    }
  </style>

  <g class="helix-layer" opacity=".98" transform="translate(-420 250) rotate(-7)">
    <g class="float-a">
      <g class="stream stream-left">
        <use href="#microHelix" x="0" y="0"/>
        <use href="#microHelix" x="240" y="0"/>
        <use href="#microHelix" x="480" y="0"/>
        <use href="#microHelix" x="720" y="0"/>
        <use href="#microHelix" x="960" y="0"/>
        <use href="#microHelix" x="1200" y="0"/>
        <use href="#microHelix" x="1440" y="0"/>
        <use href="#microHelix" x="1680" y="0"/>
        <use href="#microHelix" x="1920" y="0"/>
        <use href="#microHelix" x="2160" y="0"/>
        <use href="#microHelix" x="2400" y="0"/>
      </g>
    </g>
  </g>

  <g class="helix-layer" opacity=".86" transform="translate(-500 420) rotate(11)">
    <g class="float-b">
      <g class="stream stream-right">
        <use href="#microHelix" x="0" y="0"/>
        <use href="#microHelix" x="240" y="0"/>
        <use href="#microHelix" x="480" y="0"/>
        <use href="#microHelix" x="720" y="0"/>
        <use href="#microHelix" x="960" y="0"/>
        <use href="#microHelix" x="1200" y="0"/>
        <use href="#microHelix" x="1440" y="0"/>
        <use href="#microHelix" x="1680" y="0"/>
        <use href="#microHelix" x="1920" y="0"/>
        <use href="#microHelix" x="2160" y="0"/>
        <use href="#microHelix" x="2400" y="0"/>
      </g>
    </g>
  </g>

  <g class="helix-layer" opacity=".72" transform="translate(-390 590) rotate(-14) scale(1.08)">
    <g class="float-c">
      <g class="stream stream-left slow">
        <use href="#microHelix" x="0" y="0"/>
        <use href="#microHelix" x="240" y="0"/>
        <use href="#microHelix" x="480" y="0"/>
        <use href="#microHelix" x="720" y="0"/>
        <use href="#microHelix" x="960" y="0"/>
        <use href="#microHelix" x="1200" y="0"/>
        <use href="#microHelix" x="1440" y="0"/>
        <use href="#microHelix" x="1680" y="0"/>
        <use href="#microHelix" x="1920" y="0"/>
        <use href="#microHelix" x="2160" y="0"/>
        <use href="#microHelix" x="2400" y="0"/>
      </g>
    </g>
  </g>

  <g class="helix-layer" opacity=".34" transform="translate(-520 160) rotate(4) scale(.92)">
    <g class="stream stream-right slow">
      <use href="#microHelix" x="0" y="0"/>
      <use href="#microHelix" x="240" y="0"/>
      <use href="#microHelix" x="480" y="0"/>
      <use href="#microHelix" x="720" y="0"/>
      <use href="#microHelix" x="960" y="0"/>
      <use href="#microHelix" x="1200" y="0"/>
      <use href="#microHelix" x="1440" y="0"/>
      <use href="#microHelix" x="1680" y="0"/>
      <use href="#microHelix" x="1920" y="0"/>
      <use href="#microHelix" x="2160" y="0"/>
      <use href="#microHelix" x="2400" y="0"/>
    </g>
  </g>

  <g class="helix-layer" opacity=".28" transform="translate(-460 750) rotate(6) scale(.86)">
    <g class="stream stream-left slow">
      <use href="#microHelix" x="0" y="0"/>
      <use href="#microHelix" x="240" y="0"/>
      <use href="#microHelix" x="480" y="0"/>
      <use href="#microHelix" x="720" y="0"/>
      <use href="#microHelix" x="960" y="0"/>
      <use href="#microHelix" x="1200" y="0"/>
      <use href="#microHelix" x="1440" y="0"/>
      <use href="#microHelix" x="1680" y="0"/>
      <use href="#microHelix" x="1920" y="0"/>
      <use href="#microHelix" x="2160" y="0"/>
      <use href="#microHelix" x="2400" y="0"/>
    </g>
  </g>
</svg>
