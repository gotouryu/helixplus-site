<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="goldLine" x1="-420" y1="0" x2="1860" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6F7178" stop-opacity=".08"/>
      <stop offset=".36" stop-color="#ECD0A8" stop-opacity=".34"/>
      <stop offset=".62" stop-color="#B88A52" stop-opacity=".32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="whiteLine" x1="-420" y1="0" x2="1860" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset=".48" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ECD0A8" stop-opacity=".1"/>
    </linearGradient>
    <filter id="lineGlow" x="-15%" y="-28%" width="130%" height="156%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .helix {
      transform-box: fill-box;
      transform-origin: center;
    }

    .flow-left {
      animation: flow-left 38s linear infinite;
    }

    .flow-right {
      animation: flow-right 46s linear infinite;
    }

    .strand,
    .bridge {
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes flow-left {
      from { transform: translateX(160px); }
      to { transform: translateX(-160px); }
    }

    @keyframes flow-right {
      from { transform: translateX(-180px); }
      to { transform: translateX(180px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-left,
      .flow-right {
        animation: none;
      }
    }
  </style>

  <g class="helix flow-left" opacity=".9">
    <path class="strand" stroke="url(#goldLine)" stroke-width="2.4" filter="url(#lineGlow)"
      d="M-420 590 C-300 410 -180 410 -60 590 C60 770 180 770 300 590 C420 410 540 410 660 590 C780 770 900 770 1020 590 C1140 410 1260 410 1380 590 C1500 770 1620 770 1740 590 C1860 410 1980 410 2100 590"/>
    <path class="strand" stroke="url(#whiteLine)" stroke-width="1.75"
      d="M-420 360 C-300 540 -180 540 -60 360 C60 180 180 180 300 360 C420 540 540 540 660 360 C780 180 900 180 1020 360 C1140 540 1260 540 1380 360 C1500 180 1620 180 1740 360 C1860 540 1980 540 2100 360"/>
    <g stroke="#ECD0A8" stroke-width=".9" stroke-opacity=".24">
      <line class="bridge" x1="-60" y1="590" x2="-60" y2="360"/>
      <line class="bridge" x1="300" y1="590" x2="300" y2="360"/>
      <line class="bridge" x1="660" y1="590" x2="660" y2="360"/>
      <line class="bridge" x1="1020" y1="590" x2="1020" y2="360"/>
      <line class="bridge" x1="1380" y1="590" x2="1380" y2="360"/>
      <line class="bridge" x1="1740" y1="590" x2="1740" y2="360"/>
    </g>
  </g>

  <g class="helix flow-right" opacity=".34" transform="translate(0 -235) scale(1.04)">
    <path class="strand" stroke="#ECD0A8" stroke-opacity=".46" stroke-width="1.45"
      d="M-460 305 C-350 172 -240 172 -130 305 C-20 438 90 438 200 305 C310 172 420 172 530 305 C640 438 750 438 860 305 C970 172 1080 172 1190 305 C1300 438 1410 438 1520 305 C1630 172 1740 172 1850 305"/>
    <path class="strand" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="1.15"
      d="M-460 130 C-350 263 -240 263 -130 130 C-20 -3 90 -3 200 130 C310 263 420 263 530 130 C640 -3 750 -3 860 130 C970 263 1080 263 1190 130 C1300 -3 1410 -3 1520 130 C1630 263 1740 263 1850 130"/>
    <g stroke="#FFFFFF" stroke-width=".7" stroke-opacity=".13">
      <line class="bridge" x1="-130" y1="305" x2="-130" y2="130"/>
      <line class="bridge" x1="200" y1="305" x2="200" y2="130"/>
      <line class="bridge" x1="530" y1="305" x2="530" y2="130"/>
      <line class="bridge" x1="860" y1="305" x2="860" y2="130"/>
      <line class="bridge" x1="1190" y1="305" x2="1190" y2="130"/>
      <line class="bridge" x1="1520" y1="305" x2="1520" y2="130"/>
    </g>
  </g>
</svg>
