<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="goldLine" x1="-540" y1="0" x2="2220" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6F7178" stop-opacity=".06"/>
      <stop offset=".42" stop-color="#ECD0A8" stop-opacity=".34"/>
      <stop offset=".58" stop-color="#B88A52" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="whiteLine" x1="-540" y1="0" x2="2220" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".19"/>
      <stop offset="1" stop-color="#ECD0A8" stop-opacity=".09"/>
    </linearGradient>
    <filter id="lineGlow" x="-12%" y="-24%" width="124%" height="148%">
      <feGaussianBlur stdDeviation="3.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .helix {
      transform-box: fill-box;
      transform-origin: center;
    }

    .field-a {
      animation: drift-a 26s ease-in-out infinite alternate;
    }

    .field-b {
      animation: drift-b 31s ease-in-out infinite alternate;
    }

    .travel-left {
      animation: travel-left 40s linear infinite;
    }

    .travel-right {
      animation: travel-right 48s linear infinite;
    }

    .strand,
    .front,
    .back,
    .bridge {
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .front {
      animation: front-depth 7.5s ease-in-out infinite;
    }

    .back {
      animation: back-depth 7.5s ease-in-out infinite;
    }

    .front.alt {
      animation-delay: -3.75s;
    }

    .back.alt {
      animation-delay: -3.75s;
    }

    .bridge {
      animation: bridge-breathe 7.5s ease-in-out infinite;
    }

    @keyframes travel-left {
      from { transform: translateX(220px); }
      to { transform: translateX(-220px); }
    }

    @keyframes travel-right {
      from { transform: translateX(-240px); }
      to { transform: translateX(240px); }
    }

    @keyframes drift-a {
      0% { transform: translate(-18px, 10px) skewX(-1.4deg); }
      28% { transform: translate(9px, -8px) skewX(.8deg); }
      63% { transform: translate(22px, 13px) skewX(1.2deg); }
      100% { transform: translate(-10px, -6px) skewX(-.7deg); }
    }

    @keyframes drift-b {
      0% { transform: translate(16px, -12px) skewX(1deg); }
      41% { transform: translate(-13px, 9px) skewX(-1.1deg); }
      77% { transform: translate(8px, 15px) skewX(.5deg); }
      100% { transform: translate(-20px, -5px) skewX(-.8deg); }
    }

    @keyframes front-depth {
      0%, 100% { stroke-opacity: .14; stroke-width: 1.1; }
      48%, 56% { stroke-opacity: .72; stroke-width: 3; }
    }

    @keyframes back-depth {
      0%, 100% { stroke-opacity: .48; stroke-width: 2.2; }
      48%, 56% { stroke-opacity: .08; stroke-width: .9; }
    }

    @keyframes bridge-breathe {
      0%, 100% { stroke-opacity: .1; }
      48%, 56% { stroke-opacity: .28; }
    }

    @media (prefers-reduced-motion: reduce) {
      .field-a,
      .field-b,
      .travel-left,
      .travel-right,
      .front,
      .back,
      .bridge {
        animation: none;
      }
    }
  </style>

  <g class="helix field-a">
    <g class="helix travel-left">
      <path class="strand back" stroke="url(#goldLine)" filter="url(#lineGlow)"
        d="M-540 540 C-420 435 -300 435 -180 540 C-60 645 60 645 180 540 C300 435 420 435 540 540 C660 645 780 645 900 540 C1020 435 1140 435 1260 540 C1380 645 1500 645 1620 540 C1740 435 1860 435 1980 540 C2100 645 2220 645 2340 540"/>
      <path class="strand front alt" stroke="url(#goldLine)" filter="url(#lineGlow)"
        d="M-540 540 C-420 435 -300 435 -180 540 C-60 645 60 645 180 540 C300 435 420 435 540 540 C660 645 780 645 900 540 C1020 435 1140 435 1260 540 C1380 645 1500 645 1620 540 C1740 435 1860 435 1980 540 C2100 645 2220 645 2340 540"/>
      <path class="strand front" stroke="url(#whiteLine)"
        d="M-540 400 C-420 505 -300 505 -180 400 C-60 295 60 295 180 400 C300 505 420 505 540 400 C660 295 780 295 900 400 C1020 505 1140 505 1260 400 C1380 295 1500 295 1620 400 C1740 505 1860 505 1980 400 C2100 295 2220 295 2340 400"/>
      <path class="strand back alt" stroke="url(#whiteLine)"
        d="M-540 400 C-420 505 -300 505 -180 400 C-60 295 60 295 180 400 C300 505 420 505 540 400 C660 295 780 295 900 400 C1020 505 1140 505 1260 400 C1380 295 1500 295 1620 400 C1740 505 1860 505 1980 400 C2100 295 2220 295 2340 400"/>
      <g stroke="#ECD0A8" stroke-width=".85">
        <line class="bridge" x1="-180" y1="540" x2="-180" y2="400"/>
        <line class="bridge" x1="180" y1="540" x2="180" y2="400"/>
        <line class="bridge" x1="540" y1="540" x2="540" y2="400"/>
        <line class="bridge" x1="900" y1="540" x2="900" y2="400"/>
        <line class="bridge" x1="1260" y1="540" x2="1260" y2="400"/>
        <line class="bridge" x1="1620" y1="540" x2="1620" y2="400"/>
        <line class="bridge" x1="1980" y1="540" x2="1980" y2="400"/>
      </g>
    </g>
  </g>

  <g class="helix field-b" opacity=".42" transform="translate(0 -230) scale(1.03)">
    <g class="helix travel-right">
      <path class="strand back" stroke="#ECD0A8"
        d="M-560 300 C-450 222 -340 222 -230 300 C-120 378 -10 378 100 300 C210 222 320 222 430 300 C540 378 650 378 760 300 C870 222 980 222 1090 300 C1200 378 1310 378 1420 300 C1530 222 1640 222 1750 300 C1860 378 1970 378 2080 300"/>
      <path class="strand front alt" stroke="#ECD0A8"
        d="M-560 300 C-450 222 -340 222 -230 300 C-120 378 -10 378 100 300 C210 222 320 222 430 300 C540 378 650 378 760 300 C870 222 980 222 1090 300 C1200 378 1310 378 1420 300 C1530 222 1640 222 1750 300 C1860 378 1970 378 2080 300"/>
      <path class="strand front" stroke="#FFFFFF"
        d="M-560 196 C-450 274 -340 274 -230 196 C-120 118 -10 118 100 196 C210 274 320 274 430 196 C540 118 650 118 760 196 C870 274 980 274 1090 196 C1200 118 1310 118 1420 196 C1530 274 1640 274 1750 196 C1860 118 1970 118 2080 196"/>
      <path class="strand back alt" stroke="#FFFFFF"
        d="M-560 196 C-450 274 -340 274 -230 196 C-120 118 -10 118 100 196 C210 274 320 274 430 196 C540 118 650 118 760 196 C870 274 980 274 1090 196 C1200 118 1310 118 1420 196 C1530 274 1640 274 1750 196 C1860 118 1970 118 2080 196"/>
    </g>
  </g>
</svg>
