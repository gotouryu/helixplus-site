<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="ribbonGold" x1="0" y1="-28" x2="560" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111318" stop-opacity=".28"/>
      <stop offset=".16" stop-color="#6f737b" stop-opacity=".48"/>
      <stop offset=".31" stop-color="#fff1db" stop-opacity=".86"/>
      <stop offset=".48" stop-color="#b9864d" stop-opacity=".72"/>
      <stop offset=".67" stop-color="#fff8ed" stop-opacity=".78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="ribbonSteel" x1="0" y1="28" x2="560" y2="-28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset=".2" stop-color="#15181d" stop-opacity=".72"/>
      <stop offset=".43" stop-color="#f8fbff" stop-opacity=".82"/>
      <stop offset=".63" stop-color="#3b4048" stop-opacity=".62"/>
      <stop offset=".82" stop-color="#f2d2a0" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="ribbonHighlight" x1="0" y1="-18" x2="560" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#ffffff" stop-opacity=".86"/>
      <stop offset=".5" stop-color="#fff1d2" stop-opacity=".52"/>
      <stop offset=".72" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="metalGlow" x="-8%" y="-180%" width="116%" height="460%">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="metalHelixLine" viewBox="0 -52 560 104" overflow="visible">
      <path class="ribbon shadow" d="M0 0 C46 -34 94 -34 140 0 C186 34 234 34 280 0 C326 -34 374 -34 420 0 C466 34 514 34 560 0"/>
      <path class="ribbon shadow alt" d="M0 0 C46 34 94 34 140 0 C186 -34 234 -34 280 0 C326 34 374 34 420 0 C466 -34 514 -34 560 0"/>
      <path class="ribbon steel" d="M0 0 C46 -34 94 -34 140 0 C186 34 234 34 280 0 C326 -34 374 -34 420 0 C466 34 514 34 560 0"/>
      <path class="ribbon gold" d="M0 0 C46 34 94 34 140 0 C186 -34 234 -34 280 0 C326 34 374 34 420 0 C466 -34 514 -34 560 0"/>
      <path class="ribbon highlight" d="M0 0 C46 -34 94 -34 140 0 C186 34 234 34 280 0 C326 -34 374 -34 420 0 C466 34 514 34 560 0"/>
      <path class="ribbon highlight alt" d="M0 0 C46 34 94 34 140 0 C186 -34 234 -34 280 0 C326 34 374 34 420 0 C466 -34 514 -34 560 0"/>
      <g class="bars">
        <line x1="70" y1="-29" x2="70" y2="29"/>
        <line x1="210" y1="29" x2="210" y2="-29"/>
        <line x1="350" y1="-29" x2="350" y2="29"/>
        <line x1="490" y1="29" x2="490" y2="-29"/>
      </g>
    </symbol>
  </defs>

  <style>
    .stream,
    .flow {
      transform-box: fill-box;
      transform-origin: center;
    }

    .ribbon,
    .bars line {
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .ribbon {
      fill: none;
      filter: url(#metalGlow);
    }

    .shadow {
      stroke: rgba(0, 0, 0, .46);
      stroke-width: 11;
      animation: shadow-spin 6.8s linear infinite;
    }

    .gold {
      stroke: url(#ribbonGold);
      animation: gold-spin 6.8s linear infinite;
    }

    .steel {
      stroke: url(#ribbonSteel);
      animation: steel-spin 6.8s linear infinite;
    }

    .highlight {
      stroke: url(#ribbonHighlight);
      stroke-width: 1.45;
      animation: highlight-spin 6.8s linear infinite;
    }

    .bars {
      stroke: rgba(236, 208, 168, .24);
      stroke-width: 1.05;
      animation: bar-spin 6.8s linear infinite;
    }

    .flow-right {
      animation: flow-right 34s linear infinite;
    }

    .flow-right.slow {
      animation-duration: 46s;
    }

    .flow-right.fast {
      animation-duration: 28s;
    }

    .stream-a {
      opacity: .64;
      animation: stream-a 19s ease-in-out infinite;
    }

    .stream-b {
      opacity: .44;
      animation: stream-b 23s ease-in-out infinite;
    }

    .stream-c {
      opacity: .34;
      animation: stream-c 27s ease-in-out infinite;
    }

    .stream-d {
      opacity: .26;
      animation: stream-d 31s ease-in-out infinite;
    }

    @keyframes flow-right {
      from { transform: translateX(-560px); }
      to { transform: translateX(0); }
    }

    @keyframes stream-a {
      0%, 100% { transform: translate(0, 0) rotate(-7deg); }
      44% { transform: translate(20px, -14px) rotate(-3deg); }
      72% { transform: translate(-12px, 10px) rotate(-10deg); }
    }

    @keyframes stream-b {
      0%, 100% { transform: translate(0, 0) rotate(8deg); }
      50% { transform: translate(-34px, 18px) rotate(13deg); }
    }

    @keyframes stream-c {
      0%, 100% { transform: translate(0, 0) rotate(-15deg); }
      50% { transform: translate(28px, 18px) rotate(-21deg); }
    }

    @keyframes stream-d {
      0%, 100% { transform: translate(0, 0) rotate(4deg); }
      50% { transform: translate(-22px, -12px) rotate(9deg); }
    }

    @keyframes shadow-spin {
      0%, 100% { stroke-width: 10; stroke-opacity: .46; }
      25% { stroke-width: 5; stroke-opacity: .22; }
      50% { stroke-width: 9; stroke-opacity: .38; }
      75% { stroke-width: 4; stroke-opacity: .18; }
    }

    @keyframes gold-spin {
      0%, 100% { stroke-width: 3.2; stroke-opacity: .34; }
      25% { stroke-width: 10.5; stroke-opacity: .84; }
      50% { stroke-width: 2.4; stroke-opacity: .24; }
      75% { stroke-width: 7.2; stroke-opacity: .58; }
    }

    @keyframes steel-spin {
      0%, 100% { stroke-width: 9.4; stroke-opacity: .78; }
      25% { stroke-width: 2.2; stroke-opacity: .18; }
      50% { stroke-width: 8; stroke-opacity: .62; }
      75% { stroke-width: 1.9; stroke-opacity: .14; }
    }

    @keyframes highlight-spin {
      0%, 100% { stroke-width: 1.1; stroke-opacity: .2; }
      25% { stroke-width: 2.4; stroke-opacity: .74; }
      50% { stroke-width: .9; stroke-opacity: .16; }
      75% { stroke-width: 1.9; stroke-opacity: .58; }
    }

    @keyframes bar-spin {
      0%, 100% { opacity: .12; }
      25% { opacity: .34; }
      50% { opacity: .1; }
      75% { opacity: .24; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-right,
      .stream-a,
      .stream-b,
      .stream-c,
      .stream-d,
      .gold,
      .steel,
      .shadow,
      .highlight,
      .bars {
        animation: none;
      }
    }
  </style>

  <g class="stream stream-a" transform="translate(-600 340) rotate(-7)">
    <g class="flow flow-right fast">
      <use href="#metalHelixLine" x="0"/><use href="#metalHelixLine" x="560"/><use href="#metalHelixLine" x="1120"/><use href="#metalHelixLine" x="1680"/><use href="#metalHelixLine" x="2240"/>
    </g>
  </g>

  <g class="stream stream-b" transform="translate(-650 500) rotate(8) scale(1.18)">
    <g class="flow flow-right">
      <use href="#metalHelixLine" x="0"/><use href="#metalHelixLine" x="560"/><use href="#metalHelixLine" x="1120"/><use href="#metalHelixLine" x="1680"/><use href="#metalHelixLine" x="2240"/>
    </g>
  </g>

  <g class="stream stream-c" transform="translate(-540 635) rotate(-15) scale(.86)">
    <g class="flow flow-right slow">
      <use href="#metalHelixLine" x="0"/><use href="#metalHelixLine" x="560"/><use href="#metalHelixLine" x="1120"/><use href="#metalHelixLine" x="1680"/><use href="#metalHelixLine" x="2240"/>
    </g>
  </g>

  <g class="stream stream-d" transform="translate(-700 218) rotate(4) scale(.72)">
    <g class="flow flow-right slow">
      <use href="#metalHelixLine" x="0"/><use href="#metalHelixLine" x="560"/><use href="#metalHelixLine" x="1120"/><use href="#metalHelixLine" x="1680"/><use href="#metalHelixLine" x="2240"/>
    </g>
  </g>
</svg>
